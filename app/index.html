<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c1216" />
    <meta name="description" content="A savings-first Lightning wallet for kids, built for the Bitcoin Amantikir community." />
    <title>ZapSavr</title>
    <script>
      // Decode the path 404.html redirected here (see public/404.html).
      (function () {
        var params = new URLSearchParams(window.location.search);
        var p = params.get('p');
        if (p === null) return;
        var q = params.get('q');
        var newUrl =
          window.location.pathname.replace(/\/$/, '') + '/' + p +
          (q ? '?' + q : '') + window.location.hash;
        window.history.replaceState(null, '', newUrl);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
