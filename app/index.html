<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192-maskable.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c1216" />
    <meta name="description" content="A savings-first Lightning wallet for kids, built for the Bitcoin Amantikir community." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ZapSavr" />
    <title>ZapSavr</title>
    <script>
      // Applied before first paint so switching themes doesn't flash the
      // wrong one for a frame. Explicit choice wins; otherwise follow the
      // OS preference (the CSS media query below handles that case too).
      (function () {
        try {
          var stored = localStorage.getItem('zapsavr.theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', stored === 'light' ? '#f7f1e3' : '#0c1216');
          }
        } catch {}
      })();
    </script>
    <script>
      // Decode the path 404.html redirected here (see public/404.html).
      (function () {
        var params = new URLSearchParams(window.location.search);
        var p = params.get('p');
        if (p === null) return;
        var q = params.get('q');
        var newUrl =
          window.location.pathname.replace(/\/$/, '') + '/' + p +
          (q ? '?' + q : '') + window.location.hash;
        window.history.replaceState(null, '', newUrl);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
